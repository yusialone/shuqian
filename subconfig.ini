[custom]
;--- 规则集订阅 (Rulesets) ---

;1. 广告拦截 & 应用净化 (Adobe/IDM/Ads)
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
; [补全] 防止 Adobe/IDM 联网检测导致破解失效
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/adobe.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/IDM.list

;6. 日本专属分流 (用户自定义)
ruleset=🇯🇵 日本分流,https://ruleset.skk.moe/LegacyClashPremium/non_ip/stream_jp.txt
ruleset=🇯🇵 日本分流,[]GEOIP,JP

;2. AI 规则 (skk.moe)
ruleset=🤖 AI,https://ruleset.skk.moe/Clash/non_ip/ai.txt

;3. 特定应用
ruleset=🐱 Github,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Github.list
ruleset=🟣 TWITCH,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Twitch.list
ruleset=📹 油管,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=📲 telegram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

;4. 直连优化 (Fix: 补全所有直连相关规则)
ruleset=🎯 直连,https://raw.githubusercontent.com/cmliu/ACL4SSR/refs/heads/main/Clash/CFnat.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list


;5. 代理规则 (Fix: 补全 GoogleFCM 和 ProxyLite)
; [补全] 谷歌推送服务，通常需要代理
ruleset=🚀 选择节点,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🚀 选择节点,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🚀 选择节点,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/CMBlog.list
ruleset=🚀 选择节点,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🚀 选择节点,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🚀 选择节点,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list


;7. 兜底直连
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 直连,[]GEOIP,CN

;8. 漏网之鱼
ruleset=🐟 漏网之鱼,[]FINAL


;--- 策略组设置 (Proxy Groups) ---

;1. 主策略组
; 逻辑：优先自动/手动，包含各国节点和专线，最后提供 DIRECT 选项
custom_proxy_group=🚀 选择节点`select`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🚀 专线节点`[]DIRECT

;2. 基础功能组
custom_proxy_group=🚀 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

;3. 特定应用分组
custom_proxy_group=🤖 AI`select`[]🚀 选择节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 专线节点`[]♻️ 自动选择[]🚀 专线节点`[]🚀 手动选择`[]DIRECT
custom_proxy_group=🐱 Github`select`[]🚀 选择节点`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点[]🚀 专线节点`[]🚀 手动选择`[]DIRECT
custom_proxy_group=🟣 TWITCH`select`[]🚀 选择节点`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点[]🚀 专线节点`[]🚀 手动选择`[]DIRECT
custom_proxy_group=📹 油管`select`[]🚀 选择节点`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点[]🚀 专线节点`[]🚀 手动选择`[]DIRECT
custom_proxy_group=📲 telegram`select`[]🚀 选择节点`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点[]🚀 专线节点`[]🚀 手动选择`[]DIRECT


;4. 功能组
; 直连组：默认 Direct，但保留走代理的通道，防止误判
custom_proxy_group=🎯 直连`select`[]DIRECT`[]🚀 选择节点`[]♻️ 自动选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 选择节点`[]🎯 直连`[]♻️ 自动选择

; [保留] 日本分流组
custom_proxy_group=🇯🇵 日本分流`select`[]🇯🇵 日本节点`[]🚀 选择节点`[]♻️ 自动选择

;--- 地区与专线筛选 ---

; 1. 香港节点：仅匹配 HK，且排除 专线/IPLC/IEPL
custom_proxy_group=🇭🇰 香港节点`url-test`(HK|hk)`http://www.gstatic.com/generate_204`300,,50

; 2. 日本节点：匹配原关键词，但排除 专线/IPLC/IEPL
custom_proxy_group=🇯🇵 日本节点`url-test`(JP|jp)`http://www.gstatic.com/generate_204`300,,50

; 3. 美国节点：匹配原关键词，但排除 专线/IPLC/IEPL
custom_proxy_group=🇺🇲 美国节点`url-test`(US|us)`http://www.gstatic.com/generate_204`300,,50

; 4. 专线节点：保持不变，专门提取这些关键词
custom_proxy_group=🚀 专线节点`url-test`(专线|IPLC|IEPL|其他)`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
