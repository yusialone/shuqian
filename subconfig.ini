[custom]
;--- 规则集订阅 (Rulesets) ---

;0. 个人自定义直连 (置顶最高优先级)
ruleset=🎯 直连,DOMAIN-SUFFIX,yusialone.top
ruleset=🎯 直连,DOMAIN-KEYWORD,yusi

;1. 广告拦截 & 应用净化 (Adobe/IDM/Ads)
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
; [补全] 防止 Adobe/IDM 联网检测导致破解失效
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/adobe.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/IDM.list

;2. 日本专属分流 (用户自定义)
