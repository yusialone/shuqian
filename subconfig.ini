ruleset=🐟 漏网之鱼,[]FINAL


;--- 策略组设置 (Proxy Groups) ---

;1. 主策略组
custom_proxy_group=🚀 选择节点`select`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`[]🚀 专线节点`[]DIRECT

;2. 基础功能组
custom_proxy_group=🚀 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

;3. 特定应用分组 (均包含全地区及节点池供自由切换)
custom_proxy_group=🤖 AI`select`[]🇺🇲 美国节点`[]🚀 选择节点`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇨🇳 台湾节点`[]🚀 专线节点`[]DIRECT
custom_proxy_group=🐱 Github`select`[]🚀 选择节点`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`[]🚀 专线节点`[]DIRECT
custom_proxy_group=🟣 TWITCH`select`[]🚀 选择节点`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`[]🚀 专线节点`[]DIRECT
custom_proxy_group=📹 油管`select`[]🚀 选择节点`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`[]🚀 专线节点`[]DIRECT
custom_proxy_group=📲 telegram`select`[]🚀 选择节点`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`[]🚀 专线节点`[]DIRECT

;4. 功能组
custom_proxy_group=🎯 直连`select`[]DIRECT`[]🚀 选择节点`[]♻️ 自动选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 选择节点`[]🎯 直连`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`[]🚀 专线节点

; 日本分流组 (首选日本，同时保留回退主策略组)
custom_proxy_group=🇯🇵 日本分流`select`[]🇯🇵 日本节点`[]🚀 选择节点`[]♻️ 自动选择


;--- 地区与专线筛选 ---

; 1. 香港节点
custom_proxy_group=🇭🇰 香港节点`url-test`(HK|hk|港)`http://www.gstatic.com/generate_204`300,,50

; 2. 日本节点
custom_proxy_group=🇯🇵 日本节点`url-test`(JP|jp|日)`http://www.gstatic.com/generate_204`300,,50

; 3. 美国节点
custom_proxy_group=🇺🇲 美国节点`url-test`(US|us|美)`http://www.gstatic.com/generate_204`300,,50

; 4. 台湾节点
custom_proxy_group=🇨🇳 台湾节点`url-test`(TW|tw|台|新北|彰化)`http://www.gstatic.com/generate_204`300,,50

; 5. 专线节点
custom_proxy_group=🚀 专线节点`url-test`(专线|IPLC|IEPL|其他|HOME)`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
